<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2D Robot Localization</title>
  <link rel="stylesheet" href="./css/style2D.css" />
  <script type="module" src="./js/Localization2D.js" defer></script>
</head>
<body>
  <h1>🤖 2D Robot Localization</h1>

  <div>
        <button onclick="localizer.sense('high')">Sense 'High'</button>
        <button onclick="localizer.sense('low')">Sense 'Low'</button>

        <div style="margin-top: 10px;">
          <label>Move X steps: </label>
          <input type="number" id="stepX" value="1" style="width:60px">
          <label>Y steps: </label>
          <input type="number" id="stepY" value="0" style="width:60px">
          <button onclick="moveSteps()">Move ➡️⬇️</button>
        </div>

        <button style="margin-top:10px;" onclick="localizer.resetBelieve()">Reset</button>
    </div>


  <div class="world" id="world"></div>
  <script>
      function moveSteps(){
        const stepX = parseInt(document.getElementById('stepX').value) || 0;
        const stepY = parseInt(document.getElementById('stepY').value) || 0;
        localizer.move(stepX, stepY);
      }
    </script>
</body>
</html>
