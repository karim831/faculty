<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Localiaztion Project</title>
    <link rel="stylesheet" href="./css/style1D.css">
</head>
<body>
  <h1>🤖 1D Robot Localization</h1>

  <div>
    <button onclick="localizer.sense('high')">Sense 'High'</button>
    <button onclick="localizer.sense('low')">Sense 'Low'</button>

    <div style="margin-top: 10px;">
      <label>Move steps: </label>
      <input type="number" id="stepCount" value="1" style="width:60px">
      <button onclick="moveSteps()">Move ➡️</button>
    </div>

    <button style="margin-top:10px;" onclick="localizer.resetBelieve()">Reset</button>
  </div>

  <div class="world" id="world"></div>

  <script>
    class Localization1D{
      /**
       * 
       * @param {string[]} world 
       */
      constructor(world){
          this.world = world;
          this.believe = [];

          this.resetBelieve(); 
      }

      resetBelieve(){
          this.believe = Array(this.world.length).fill(1 / this.world.length);
          return this.render();
      }

      /**
       * 
       * @param {number[]} bel 
       */
      normalize(bel){
          const sum = bel.reduce((prev, curr) => prev + curr);
          return bel.map(b => b / sum);
      }

      /**
       * 
       * @param {string} measurement 
       * @param {number} pHit 
       * @param {number} pMiss 
       */
      sense(measurement, pHit = .7 , pMiss = .2){
          const newBel = this.believe.map((b,i) => {
             return b * (measurement.toLowerCase() == this.world[i].toLowerCase() ? pHit : pMiss);
          });

          this.believe = this.normalize(newBel);

          this.render();
          this.printBelieve();
      }


      /**
       * @param {number} step
       */
      move(step, pExact = .8, pOvershoot = .1, pUndershoot = 0.1){
          const n = this.world.length;
          let newBel = Array(n).fill(0);

          const mod = (v,limit) => ((v % limit) + limit) % limit;

          this.believe.forEach((b, i) => {
              newBel[mod(i + step, n)] += b * pExact;
              newBel[mod(i + step + 1, n)] += b * pOvershoot;
              newBel[mod(i + step - 1, n)] += b * pUndershoot;
          });

          this.believe = newBel;

          this.render();
          this.printBelieve();
      }

      render(){
          const container = document.getElementById('world');
          container.innerHTML = '';

          const maxBel = Math.max(...this.believe);
          this.believe.forEach((b, i) => {
            const cell = document.createElement('div');
            cell.className = 'cell ' + this.world[i].toLowerCase();

            const bar = document.createElement('div');
            bar.className = 'bel-bar';
            bar.style.height = `${(b / maxBel) * 100}%`;

            const label = document.createElement('div');
            label.style.position = 'absolute';
            label.style.top = '5px';
            label.style.fontSize = '12px';
            label.textContent = `#${i}\n${this.world[i]}`;

            cell.appendChild(bar);
            cell.appendChild(label);
            container.appendChild(cell);
          });
      }

      printBelieve(){
          console.log("Current belief:");
          this.believe.forEach((b, i) => {
              console.log(`Cell ${i} (${this.world[i]}): ${b.toFixed(4)}`);
          });
          console.log("Sum:", this.believe.reduce((a, b) => a + b, 0).toFixed(4));
      }
    }
    const world = ['High','Low','Low','High','Low','High','Low','Low'];

    window.localizer =  new Localization1D(world);

    function moveSteps() {
      const steps = parseInt(document.getElementById('stepCount').value) || 0;
      localizer.move(steps);
    }
  </script>

</body>
</html>
